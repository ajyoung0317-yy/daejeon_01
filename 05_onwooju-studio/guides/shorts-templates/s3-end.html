<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="_base.css">
<!-- 마무리 장면: 온우주별점(운영자 별점만) + 누구와 + 질문 + 계정. 별점이 없으면 .score/.stars 를 지운다 -->
</head>
<body class="review">
<div class="canvas">
  <div class="photo" style="opacity:.35"></div>
  <div class="fade"></div>
  <div class="logo">onspace<i>.</i>film_</div>
  <div class="copy">
    <div class="label">🌌 온우주별점</div>
    <div class="score"><b>4.0</b><span>/ 5</span></div>
    <div class="stars">★★★★☆</div>
    <div class="who">👥 친구와 금요일 밤에 보기 좋아요</div>
    <div class="ask">여러분은 어떻게 보셨나요?<br>댓글로 들려주세요</div>
    <div class="handle">@onspace.film_</div>
  </div>
  <div class="safe"></div>
</div>
</body>
</html>
