<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<style>
  /* ===== 영화 톤 공통 토큰 (film/ 템플릿 동일) ===== */
  :root {
    --page: #efebe4; --paper: #faf8f4;
    --ink: #1c1a17; --muted: #857c71; --line: #ddd6cb;
    --accent: #8c6a43;
    --serif: "Noto Serif KR", "Batang", serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--page); font-family: "Pretendard", "Malgun Gothic", sans-serif; color: var(--ink); }
  .canvas { width: 860px; padding: 36px; background: var(--page); }
  .paper { background: var(--paper); padding: 44px 52px 48px; }
  .label { display: flex; align-items: center; gap: 12px; font-size: 14px; font-weight: 600; letter-spacing: 1px; color: var(--accent); }
  .label::before { content: ""; width: 28px; height: 1px; background: var(--accent); }
  h1 { margin-top: 14px; font: 700 30px/1.35 var(--serif); letter-spacing: -0.5px; }

  /* ===== 타임라인: 3~5단계, 가로 선 위의 점 ===== */
  .line { display: flex; margin-top: 40px; }
  .step { position: relative; flex: 1; min-width: 0; padding-right: 12px; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 15px; right: 0; top: 7px; height: 1px; background: var(--line); }
  .dot { width: 15px; height: 15px; border-radius: 50%; background: var(--paper); border: 1.5px solid var(--muted); }
  .when { margin-top: 20px; font: 700 22px/1.3 var(--serif); }
  .what { margin-top: 8px; font-size: 15px; color: var(--muted); line-height: 1.45; word-break: keep-all; }
  .step.now .dot { background: var(--accent); border-color: var(--accent); }
  .step.now .when { color: var(--accent); }
  .step.now .what { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="canvas">
  <div class="paper">
    <div class="label">개봉까지의 여정</div>
    <h1>베니스에서 국내 극장까지</h1>
    <div class="line">
      <div class="step"><div class="dot"></div><div class="when">베니스</div><div class="what">남우주연상 수상</div></div>
      <div class="step"><div class="dot"></div><div class="when">영화제 상영</div><div class="what">텔루라이드 · 토론토</div></div>
      <div class="step"><div class="dot"></div><div class="when">10월 8일~</div><div class="what">부산영화제 공개</div></div>
      <div class="step now"><div class="dot"></div><div class="when">11월 4일</div><div class="what">국내 극장 개봉</div></div>
      <div class="step"><div class="dot"></div><div class="when">11월 6일</div><div class="what">미국 개봉</div></div>
    </div>
  </div>
</div>
</body>
</html>
