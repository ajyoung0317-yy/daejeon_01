<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="_base.css">
<!-- 마무리 장면 -->
<style>.ask{font-size:48px}</style>
</head>
<body class="review">
<div class="canvas">
  <div class="photo" style="--still:url('source/still-09.jpg'); background-position: 38% center; opacity:.35"></div>
  <div class="fade"></div>
  <div class="logo">onspace<i>.</i>film_</div>
  <div class="credit">ⓒ 롯데엔터테인먼트 · Paramount Pictures</div>
  <div class="copy">
    <div class="label">🌌 온우주별점</div>
    <div class="score"><b>4.0</b><span>/ 5</span></div>
    <div class="stars">★★★★☆</div>
    <div class="who">👥 반려견과 함께 사는 분께 권해요</div>
    <div class="ask">여러분 곁의 '오딘'은 누구인가요?</div>
    <div class="handle">@onspace.film_</div>
  </div>
  <div class="safe"></div>
</div>
</body>
</html>
