<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>경쟁사 상세페이지 비교</title>
<style>
/* 이름 붙인 색 5가지 (째깍악어 홈페이지 분위기에 맞춤) */
:root{
  --sunny-yellow:#F2C744;   /* 째깍악어 겨자 노랑: 버튼, 강조 */
  --croc-green:#2E8B57;     /* 악어 초록: 경쟁사 이름, 링크 */
  --jungle-ink:#19191A;     /* 진한 먹색: 글자 */
  --cream-sand:#FFF9E8;     /* 크림: 맨 위 바탕 */
  --cloud-gray:#F7F7F8;     /* 구름 회색: 전체 바탕, 칩 */
  --bg:var(--cloud-gray);--card:#fff;--ink:var(--jungle-ink);--sub:#6B6B70;--line:#ECECEE;
  --accent:var(--croc-green);--accent-soft:var(--cream-sand);--muted:#ABABB0;--chip:#fff;
}
@media (prefers-color-scheme:dark){:root{--cream-sand:#2A2412;--bg:#141416;--card:#1E1E21;--ink:#F2F2F3;--sub:#A8A8AE;--line:#2C2C30;--accent:#6CC98A;--accent-soft:#2A2412;--muted:#66666C;--chip:#1E1E21}}
.card{border-radius:18px!important;box-shadow:0 2px 10px rgba(0,0,0,.05)}
*{box-sizing:border-box}
/* 글꼴 1가지 */
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;line-height:1.55}
.hero{background:var(--sunny-yellow);color:#19191A;border-radius:20px;padding:20px;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-36px;top:-36px;width:150px;height:150px;border-radius:50%;background:rgba(46,139,87,.16);pointer-events:none}
.hero>*{position:relative;z-index:1}

.what,.big,h2,.card h3{font-family:'BithumbGothicOriginal',"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:700;letter-spacing:-.01em}
.what{font-size:20px}
.big{font-size:44px}
h2{font-size:18px}
.card h3{font-size:20px}
@media (max-width:560px){.what{font-size:17px}.big{font-size:32px}}
.hero .big-box{border-left-color:var(--croc-green)}
.croc{font-size:32px;line-height:1;margin-bottom:6px}
.what{font-size:18px;font-weight:700;margin:0 0 14px;max-width:640px}
.big-box{background:var(--card);border-radius:18px;padding:16px 18px;box-shadow:0 2px 10px rgba(0,0,0,.05);border-left:8px solid var(--sunny-yellow)}
.big-label{margin:0;font-size:13px;font-weight:600;color:var(--sub)}
.big{margin:2px 0 0;font-size:40px;font-weight:800;line-height:1.15}
.big-sub{margin:4px 0 0;font-size:14px;color:var(--sub)}
@media (max-width:560px){.big{font-size:30px}.what{font-size:15px}}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.lead{color:var(--sub);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--sub);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.bar .lbl{font-size:13px;color:var(--sub);min-width:64px}
button.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}
button.chip[aria-pressed="true"]{background:var(--sunny-yellow);border-color:var(--sunny-yellow);color:var(--jungle-ink);font-weight:700}
.card h3{color:var(--accent)}
.pfill{background:var(--sunny-yellow)!important}
.file{font-size:13px;color:var(--sub);margin:6px 0 18px}
.file input{font-size:13px;max-width:100%}
h2{font-size:16px;margin:22px 0 10px}
.price{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:120px 1fr;gap:10px;align-items:center;font-size:14px}
.ptrack{background:var(--chip);border-radius:6px;height:26px;position:relative}
.pfill{background:var(--accent);height:100%;border-radius:6px;min-width:2px}
.pval{position:absolute;left:8px;top:3px;font-weight:600;font-size:13px;color:var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.card h3{margin:0 0 10px;font-size:18px}
.field{border-top:1px solid var(--line);padding:8px 0}
.field:first-of-type{border-top:0}
.k{font-size:12px;color:var(--sub);margin-bottom:2px}
.v{font-size:14px;word-break:break-word}
.v a{color:var(--accent);word-break:break-all}
.nf{color:var(--muted);font-style:italic}
.hl .v{background:var(--accent-soft);border-radius:6px;padding:4px 6px}
footer{margin-top:30px;color:var(--sub);font-size:13px;border-top:1px solid var(--line);padding-top:14px}
.empty{color:var(--sub);padding:20px 0}
@media (max-width:560px){.stats{grid-template-columns:1fr 1fr 1fr}.stat b{font-size:18px}.prow{grid-template-columns:84px 1fr}h1{font-size:19px}}
/* 바뀐 곳: 주황 = 값이 바뀜, 하늘 = (확인 필요) */
:root{--chg:#FF8A3D;--chg-soft:#FFF0E5;--chk:#3D8BFF;--chk-soft:#EAF2FF}
@media (prefers-color-scheme:dark){:root{--chg-soft:#3A2414;--chk-soft:#14243A}}
.diffbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.diffmeta{font-size:13px;color:var(--sub);margin:0 0 10px}
.dgroup{margin:10px 0 4px;font-size:14px;font-weight:700}
.ditem{border-left:6px solid var(--chg);background:var(--chg-soft);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:14px}
.ditem.chk{border-left-color:var(--chk);background:var(--chk-soft)}
.ditem .t{font-weight:700}
.old{text-decoration:line-through;color:var(--sub)}
.arrow{margin:0 6px;color:var(--sub)}
.newv{font-weight:700}
.memo{font-size:12px;color:var(--sub);margin-top:2px}
.nodiff{font-size:18px;font-weight:700;margin:4px 0}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:6px;color:#fff;background:var(--chg)}
.tag.chk{background:var(--chk)}
.field.chg .v{background:var(--chg-soft);border-left:4px solid var(--chg);border-radius:6px;padding:4px 6px}
.field.chk .v{background:var(--chk-soft);border-left:4px solid var(--chk);border-radius:6px;padding:4px 6px}
.field .was{font-size:12px;margin-top:3px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="croc" aria-hidden="true">🐊</div>
    <p class="what">경쟁 돌봄 서비스 3곳의 요금·광고·문구를 한 화면에서 비교하는 탐험 지도</p>
    <div class="big-box">
      <p class="big-label">공개된 가격 중 가장 싼 곳</p>
      <p class="big" id="bigResult">-</p>
      <p class="big-sub" id="bigSub"></p>
    </div>
  </header>
  <div class="stats">
    <div class="stat"><span>조사일</span><b id="sDate">-</b></div>
    <div class="stat"><span>경쟁사 수</span><b id="sCount">-</b></div>
    <div class="stat"><span>"못 찾음" 칸</span><b id="sNf">-</b></div>
  </div>

  <h2>바뀐 곳</h2>
  <div class="diffbox" id="diff"></div>
  <div class="bar" id="coBar"><span class="lbl">경쟁사</span></div>
  <div class="bar" id="colBar"><span class="lbl">칸</span></div>
  <div class="file">다른 CSV로 바꿔 보기: <input type="file" id="csvFile" accept=".csv,text/csv"> <span id="fileMsg"></span></div>

  <h2>공개된 최저 가격 비교 (원)</h2>
  <div class="price" id="price"></div>

  <h2>경쟁사별 비교</h2>
  <div class="cards" id="cards"></div>

  <footer>공개 자료로 만든 학습용 MVP(Minimum Viable Product)이며, 조사한 회사와 관계없습니다<br><small>제목 글꼴: 빗썸고딕 Original (SIL Open Font License 1.1)</small></footer>
</div>
<script>
const EMBED = "조사일,경쟁사,대표 문구(홈페이지),광고 문구(메타),광고 시작일,요금 방식,공개된 최저 가격(원),서비스 종류,앱스토어 별점(한국),출처 링크\n2026-11-16,맘시터,\"좋은 시터 / 빨리 찾는, 맘시터\",\"첫 출산이라 어려우신가요?👩‍🍼 맘시터 산후도우미 예약하기🍼 (부모 대상 광고 중 가장 최근 시작, 광고주: 맘시터 산후도우미)\",26/11/10시작,\"이용권을 사고, 시터와 합의한 시급으로 앱에서 정산 (앱 설명: \"\"돌봄 결제: 합의된 시급과 일지를 기반으로 깔끔하게 정산\"\")\",못 찾음,\"신생아/영아 풀타임 돌봄, 신생아/영아 보조 돌봄, 등하원 돌봄, 놀이/학습 돌봄, 긴급/단기 돌봄\",4.1 (평가 1.9천개),https://www.mom-sitter.com ; https://apps.apple.com/kr/app/id1452104879 ; 광고: 메타 광고 라이브러리 글 (2026-11-16 다시 봄) https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=KR&q=맘시터 ; 가격: 홈페이지에 이용권 구매 페이지 주소가 없어 못 찾음\n2026-11-16,자란다,\"돌봄과 배움을 함께, 우리아이 단짝쌤 찾기 / 아이가 자라며 필요한 모든 것, 자란다 하나로\",아직도 이거 모르는 사람 있음? (부모 대상 광고 중 가장 최근 시작),26/11/02시작,\"1회 방문, 정기 방문, 긴급돌봄 중 선택 (홈페이지: \"\"1회 방문부터 정기 방문, 긴급돌봄까지.\"\")\",못 찾음,\"돌봄(놀이·책읽기 등), 외국어, 수학/과학, 한글/국어, 운동, 예능, 등하원\",4.6 (평가 844개),https://www.jaranda.kr ; https://apps.apple.com/kr/app/id1469857402 ; 광고: 메타 광고 라이브러리 글 (2026-11-16 다시 봄) https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=KR&q=자란다\n2026-11-16,아워스팟,등하원 픽업은 아워스팟,못 찾음,못 찾음,\"월 멤버십 (Light 멤버십 월~토 19,000원, 주중 멤버십 염리·한서 49,000원) + 클래스 따로 결제\",19000,\"하교 픽업, 학원 이동, 거점 돌봄(간식·숙제·보드게임), 방학·주말 클래스\",못 찾음,\"https://ourspot.kr ; https://ourspot.kr/membership ; 광고: 메타 광고 라이브러리 아워스팟 페이지, 게재 중 광고 없음 (2026-11-16 다시 봄)\"\n";
const DIFF = {"time": "2026-11-16 14:18", "old": "research.csv", "new": "research_new.csv", "items": [{"kind": "확인 필요", "co": "맘시터", "col": "광고 문구(메타)", "a": "산후도우미끝나고막막하시죠.", "b": "첫 출산이라 어려우신가요?👩‍🍼 맘시터 산후도우미 예약하기🍼 (부모 대상 광고 중 가장 최근 시작, 광고주: 맘시터 산후도우미)", "memo": "출처 바뀜: 내가 직접 봄(광고 영상/화면) → 메타 광고 라이브러리 글. 앞 광고(9/3)는 라이브러리 글에서 '막막' 문구를 못 찾음. 영상 속 문구일 수 있음. 11/10 새 광고가 보임"}, {"kind": "확인 필요", "co": "맘시터", "col": "광고 시작일", "a": "26/09/03시작", "b": "26/11/10시작", "memo": "출처 바뀜: 내가 직접 봄(광고 영상/화면) → 메타 광고 라이브러리 글. 11/10에 새로 시작한 부모 대상 광고가 보임"}, {"kind": "확인 필요", "co": "맘시터", "col": "공개된 최저 가격(원)", "a": "44900", "b": "못 찾음", "memo": "출처 바뀜: 이용권 구매 페이지 → 홈페이지(이용권 페이지 주소 못 찾음). 홈페이지와 검색에서 44,900원을 다시 확인하지 못함"}, {"kind": "바뀐 곳", "co": "맘시터", "col": "서비스 종류", "a": "신생아/영아 풀타임 돌봄, 등하원 돌봄, 놀이/학습 돌봄", "b": "신생아/영아 풀타임 돌봄, 신생아/영아 보조 돌봄, 등하원 돌봄, 놀이/학습 돌봄, 긴급/단기 돌봄", "memo": "보조 돌봄, 긴급/단기 돌봄이 새로 보임 (지난번에 일부만 적었을 수도 있음)"}, {"kind": "확인 필요", "co": "자란다", "col": "광고 문구(메타)", "a": "요즘맞벌이부부종일반대신00한다는데.", "b": "아직도 이거 모르는 사람 있음? (부모 대상 광고 중 가장 최근 시작)", "memo": "출처 바뀜: 내가 직접 봄(광고 영상/화면) → 메타 광고 라이브러리 글. 10/15 시작 광고는 아직 게재 중. 앞 문구는 영상 속 문구라 글로는 확인 못 함. 11/2 새 광고가 보임"}, {"kind": "확인 필요", "co": "자란다", "col": "광고 시작일", "a": "26/10/15시작", "b": "26/11/02시작", "memo": "출처 바뀜: 내가 직접 봄(광고 영상/화면) → 메타 광고 라이브러리 글. 11/2에 새로 시작한 부모 대상 광고가 보임"}]};
const NF = "못 찾음";
const KEY_COLS = ["요금 방식","공개된 최저 가격(원)","광고 문구(메타)"]; // 꼭 볼 칸: 강조
let head=[], rows=[], selCo=new Set(), selCol=new Set();

function parseCSV(text){
  text=text.replace(/^﻿/,"");
  const out=[]; let row=[], cell="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; }
      else cell+=c;
    }else{
      if(c==='"') q=true;
      else if(c===','){row.push(cell);cell="";}
      else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(cell); out.push(row); row=[]; cell=""; }
      else cell+=c;
    }
  }
  if(cell!==""||row.length){row.push(cell);out.push(row);}
  return out.filter(r=>r.some(x=>x.trim()!==""));
}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
function isNf(v){return v.trim().startsWith(NF);}
function linkify(v){
  return esc(v).replace(/https?:\/\/[^\s;,]+/g,u=>`<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function load(text){
  const all=parseCSV(text);
  if(all.length<2){document.getElementById("cards").innerHTML='<p class="empty">표에 내용이 없습니다.</p>';return;}
  head=all[0].map(h=>h.trim()); rows=all.slice(1).map(r=>head.map((_,i)=>(r[i]||"").trim()));
  selCo=new Set(); selCol=new Set();
  buildBars(); render();
}
function iCo(){return Math.max(0,head.indexOf("경쟁사"));}
function iDate(){return head.indexOf("조사일");}
function dataCols(){return head.map((h,i)=>i).filter(i=>i!==iCo()&&i!==iDate());}
function chip(label,on,fn){const b=document.createElement("button");b.className="chip";b.textContent=label;b.setAttribute("aria-pressed",on);b.onclick=fn;return b;}
function buildBars(){
  const cb=document.getElementById("coBar"), lb=document.getElementById("colBar");
  cb.querySelectorAll("button").forEach(b=>b.remove()); lb.querySelectorAll("button").forEach(b=>b.remove());
  const cos=[...new Set(rows.map(r=>r[iCo()]))];
  cb.appendChild(chip("전체",selCo.size===0,()=>{selCo.clear();buildBars();render();}));
  cos.forEach(c=>cb.appendChild(chip(c,selCo.has(c),()=>{selCo.has(c)?selCo.delete(c):selCo.add(c);buildBars();render();})));
  lb.appendChild(chip("전체",selCol.size===0,()=>{selCol.clear();buildBars();render();}));
  dataCols().forEach(i=>{const h=head[i];lb.appendChild(chip(h,selCol.has(h),()=>{selCol.has(h)?selCol.delete(h):selCol.add(h);buildBars();render();}));});
}
function render(){
  const vis=rows.filter(r=>selCo.size===0||selCo.has(r[iCo()]));
  const cols=dataCols().filter(i=>selCol.size===0||selCol.has(head[i]));
  const dates=[...new Set(rows.map(r=>iDate()>=0?r[iDate()]:"").filter(Boolean))];
  document.getElementById("sDate").textContent=dates.join(", ")||"-";
  document.getElementById("sCount").textContent=new Set(rows.map(r=>r[iCo()])).size+"곳";
  document.getElementById("sNf").textContent=rows.reduce((n,r)=>n+r.filter(isNf).length,0)+"칸";
  // 가격 막대
  const pi=head.findIndex(h=>h.includes("가격"));
  // 맨 위 큰 결과: 공개 가격이 가장 낮은 곳 (전체 표 기준)
  const bigEl=document.getElementById("bigResult"), subEl=document.getElementById("bigSub");
  const priced=pi<0?[]:rows.map(r=>({co:r[iCo()],n:parseInt(r[pi].replace(/[^0-9]/g,""),10)})).filter(x=>!isNaN(x.n));
  if(priced.length){
    const m=priced.reduce((a,b)=>b.n<a.n?b:a);
    bigEl.textContent=`${m.co} ${m.n.toLocaleString("ko-KR")}원`;
    subEl.textContent=`가격이 공개된 ${priced.length}곳 중 · 가격을 못 찾은 곳 ${new Set(rows.map(r=>r[iCo()])).size-new Set(priced.map(x=>x.co)).size}곳`;
  }else{bigEl.textContent=NF;subEl.textContent="공개된 가격이 없습니다";}
  const pe=document.getElementById("price"); pe.innerHTML="";
  if(pi<0){pe.innerHTML='<p class="empty">가격 칸이 없습니다.</p>';}
  else{
    const nums=vis.map(r=>parseInt(r[pi].replace(/[^0-9]/g,""),10));
    const max=Math.max(1,...nums.filter(n=>!isNaN(n)));
    vis.forEach((r,k)=>{
      const n=nums[k], d=document.createElement("div"); d.className="prow";
      const fill=isNaN(n)?"":`<div class="pfill" style="width:${Math.round(n/max*100)}%"></div>`;
      const val=isNaN(n)?`<span class="pval nf">${NF}</span>`:`<span class="pval">${n.toLocaleString("ko-KR")}원</span>`;
      d.innerHTML=`<div>${esc(r[iCo()])}</div><div class="ptrack">${fill}${val}</div>`;
      pe.appendChild(d);
    });
  }
  // 카드
  const ce=document.getElementById("cards"); ce.innerHTML="";
  renderDiff();
  if(!vis.length){ce.innerHTML='<p class="empty">고른 경쟁사가 없습니다.</p>';return;}
  vis.forEach(r=>{
    const c=document.createElement("div"); c.className="card";
    let h=`<h3>${esc(r[iCo()])}</h3>`;
    cols.forEach(i=>{
      const v=r[i]||NF, hl=KEY_COLS.includes(head[i])?" hl":"";
      const d=dfind(r[iCo()],head[i]), dc=d?(d.kind==="확인 필요"?" chk":" chg"):"";
      const was=d?`<div class="was"><span class="tag${d.kind==="확인 필요"?" chk":""}">${d.kind==="확인 필요"?"확인 필요":"바뀜"}</span> 앞 값: <span class="old">${esc(d.a)}</span></div>`:"";
      h+=`<div class="field${dc||hl}"><div class="k">${esc(head[i])}</div><div class="v${isNf(v)?" nf":""}">${linkify(v)}</div>${was}</div>`;
    });
    c.innerHTML=h; ce.appendChild(c);
  });
}
document.getElementById("csvFile").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{usingEmbed=false;load(rd.result);document.getElementById("fileMsg").textContent=f.name+" 불러옴";};
  rd.readAsText(f,"utf-8");
});
let usingEmbed=true;
function dfind(co,col){return usingEmbed?DIFF.items.find(d=>d.co===co&&d.col===col):null;}
function renderDiff(){
  const el=document.getElementById("diff");
  const meta=`<p class="diffmeta">비교한 시각 ${esc(DIFF.time)} · 앞 표 ${esc(DIFF.old)} → 새 표 ${esc(DIFF.new)}</p>`;
  const vis=DIFF.items.filter(d=>selCo.size===0||selCo.has(d.co));
  const one=d=>{const k=d.kind==="확인 필요"?" chk":"";
    const ab=d.col==="(줄 전체)"?`<span class="newv">${esc(d.kind)}</span>`:`<span class="old${isNf(d.a)?" nf":""}">${esc(d.a)}</span><span class="arrow">→</span><span class="newv${isNf(d.b)?" nf":""}">${esc(d.b)}</span>`;
    return `<div class="ditem${k}"><div class="t">${esc(d.co)} · ${esc(d.col)}${d.kind==="확인 필요"?'<span class="tag chk">확인 필요</span>':'<span class="tag">바뀜</span>'}</div><div>${ab}</div>${d.memo?`<div class="memo">${esc(d.memo)}</div>`:""}</div>`;};
  const groups=[["바뀐 곳",vis.filter(d=>d.kind==="바뀐 곳")],["새로 생긴 줄",vis.filter(d=>d.kind==="새로 생긴 줄")],["사라진 줄",vis.filter(d=>d.kind==="사라진 줄")],["(확인 필요) 못 찾음↔값, 출처가 바뀐 칸",vis.filter(d=>d.kind==="확인 필요")]];
  const realN=vis.filter(d=>d.kind!=="확인 필요").length;
  let h=meta;
  if(realN===0) h+=`<p class="nodiff">바뀐 곳 없음</p>`;
  groups.forEach(([t,list])=>{if(list.length) h+=`<p class="dgroup">${t} (${list.length})</p>`+list.map(one).join("");});
  if(!usingEmbed) h+=`<p class="memo">다른 CSV를 불러와서 카드에는 바뀐 곳 색을 칠하지 않습니다.</p>`;
  el.innerHTML=h;
}
load(EMBED);
</script>
</body>
</html>
